# Only the actions are watched, because only the actions go stale in
# silence. A pinned major keeps running long after a new one ships and
# says nothing about it -- `actions/upload-artifact@v4` sat three majors
# behind here until it was looked up by hand. Julia is not covered
# because Dependabot has no Pkg ecosystem to cover it with. That used to
# cost nothing, TreeAMR being reached through a [sources] entry on a
# moving branch; it costs little now either, because the `[compat]` bound
# that replaced it is a floor over the whole 0.1 series -- a new TreeAMR
# patch is picked up on the next resolve, with no version string to bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One pull request a month for all of them, rather than one per
    # action: these move together and are reviewed together.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: CI
