name: CI

# Two tiers, the same in every Tree* repository. A pull request runs the
# Linux cells only, uninstrumented: the full suite has already run on the
# author's machine (macOS, arm64), so what CI adds there is x86-64 Linux,
# a clean environment and bounds checks. A push to `main`, the weekly
# schedule and a manual dispatch run the whole matrix, macOS and coverage
# included. Markdown-only changes run nothing, since no test reads them.
# Tags are not tested: a release tags a commit that has passed on `main`.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Weekly, for what changes without a push here: the registry, and the
  # dependencies taken from `main` through `[sources]`. The Tree*
  # repositories are staggered by 20 minutes so that their macOS cells do
  # not queue behind each other (five run at once per account).
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.13 is the floor and the only version tested, with all
        # the Tree* packages since 2026-10-16 ("The Julia floor" in
        # HISTORY.md has the history).
        version: ["1.13"]
        # macOS only off pull requests (see `on:` above).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macOS-latest"]') }}
        # `threads` is a matrix key, so that the threaded entry below
        # overwrites it and adds a cell. Without the key the entry merged
        # into the serial Linux cell, and there was no serial Linux cell
        # until 2026-11-05.
        threads: [1]
        include:
          - version: "1.13"
            os: ubuntu-latest
            threads: 4
    # Coverage on one cell, macOS at one thread, and never on a pull
    # request: it is bought once per push to `main`, where the badge reads
    # it. Not a Linux cell: `--code-coverage` together with
    # `--check-bounds=yes` miscompiles on GitHub's AVX-512 Zen 4/5 runners
    # under Julia 1.13 (TreeGeneralizedHarmonic's CI.yml has the probes).
    env:
      COVERAGE: ${{ matrix.os == 'macOS-latest' && matrix.threads == 1 && github.event_name != 'pull_request' }}
      # Precompiled code for every Linux cell is built for one generic
      # x86 CPU, not the runner's own; see the viewer job below.
      # macOS runners all share one CPU, so `native` is fine there (an
      # x86 target string would not even be valid on arm64).
      JULIA_CPU_TARGET: ${{ matrix.os == 'ubuntu-latest' && 'x86-64-v3' || 'native' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # Which CPU this runner has, so that a cache that was restored and
      # then rebuilt anyway can be matched against the runner that saved it.
      - name: Show the runner's CPU
        run: |
          if command -v lscpu >/dev/null; then
            lscpu | grep -E '^(Model name|Flags)' | cut -c1-200
          else
            sysctl -n machdep.cpu.brand_string
          fi
      # The CPU target is part of the key. Julia does not refuse a cached
      # file built for a different target, as long as this runner's CPU
      # can run it, so without this the caches saved before the target
      # was set (built for `native`) would carry on being restored, and
      # refused only when they landed on a different CPU model.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=${{ env.JULIA_CPU_TARGET }}
      - uses: julia-actions/julia-buildpkg@v1
      # `check_bounds: yes` is the action's default, but it is stated here
      # because the package now relies on it: the RHS kernel's reads are
      # `@inbounds` (see "What bounds checking costs" in CODE.md), and
      # `--check-bounds=yes` overrides `@inbounds` package-wide, so this
      # is the only place a stencil that walks out of its block would be
      # caught. A default that quietly changed would turn the assertion
      # into memory corruption rather than a test failure.
      - uses: julia-actions/julia-runtest@v1
        with:
          check_bounds: 'yes'
          # Coverage on the serial macOS cell only (`env` above). Not the
          # threaded cell: it is the expensive one -- a 4-vCPU runner is oversubscribed
          # by `--threads=4` plus the subprocess the thread-independence
          # test spawns -- and it runs the same lines as the serial cells
          # anyway, so instrumenting it would buy nothing and cost the
          # slowest job in the matrix.
          coverage: ${{ env.COVERAGE }}
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial (M5). One entry of the matrix is enough to guard
          # that: the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered.
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: env.COVERAGE == 'true'
      - uses: codecov/codecov-action@v7
        if: env.COVERAGE == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # The viewer has its own environment and its own copy of the TreeAMR
  # dependency, so the test job above cannot exercise it -- during
  # development that let `bin/` keep building against an older TreeAMR than
  # the tests, until it failed on an API the tests were already using. This
  # job runs it for real and keeps the figures, so a plot that silently
  # stops making sense is visible rather than merely unbroken.
  viewer:
    name: Viewer (bin/)
    runs-on: ubuntu-latest
    # GitHub's `ubuntu-latest` runners have different x86 CPUs, and
    # Julia builds precompiled code for the CPU it is on (`native`) unless
    # told otherwise. The cache key does not include the CPU, so a cache
    # saved on one CPU model and restored on another was thrown away:
    # 352 of 392 packages rebuilt after a cache hit (Makie alone takes
    # ~165 s), while the 40 that survived were the ones shipped
    # precompiled with Julia, which is not built for `native` either.
    # `x86-64-v3` (AVX2, FMA; Haswell and later, every runner GitHub has)
    # is one target, so a build costs what it did and the cache is no
    # larger; code for it loads on any of the runners, at the price of
    # not using AVX-512 where a runner has it.
    env:
      JULIA_CPU_TARGET: "x86-64-v3"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      # Which CPU this runner has, so that a cache that was restored and
      # then rebuilt anyway can be matched against the runner that saved it.
      - name: Show the runner's CPU
        run: |
          if command -v lscpu >/dev/null; then
            lscpu | grep -E '^(Model name|Flags)' | cut -c1-200
          else
            sysctl -n machdep.cpu.brand_string
          fi
      # The CPU target is part of the key. Julia does not refuse a cached
      # file built for a different target, as long as this runner's CPU
      # can run it, so without this the caches saved before the target
      # was set (built for `native`) would carry on being restored, and
      # refused only when they landed on a different CPU model.
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=${{ env.JULIA_CPU_TARGET }}
      - name: Instantiate the viewer environment
        run: julia --project=bin -e 'using Pkg; Pkg.instantiate()'
      - name: Render the 1D cases
        run: julia --project=bin bin/visualize.jl --no-display
      # The reduced-precision path has its own conversions -- at the plotting
      # boundary, and in the blast wave's Float64 reference table -- and none
      # of them are exercised by the default render. A figure is also the
      # quickest way to see whether a Float32 run is still the same run: this
      # one must show the same 16 blocks at maxlevel 2 as the figure above.
      - name: Render the 1D pulse at Float32
        run: julia --project=bin bin/visualize.jl --case=pulse --type=f32 --no-display
      - name: Render the 2D blast wave, tracking and with the scale frozen
        run: |
          julia --project=bin bin/visualize2d.jl --no-display
          julia --project=bin bin/visualize2d.jl --frozen-scales --no-display
      # The cell-centred layout is kept as the comparison, and a figure is
      # the quickest way to see what the stagger does and does not change:
      # the same ring, the same blocks, the same levels, with the samples
      # half a spacing off the block outlines because a vertex-centred
      # block owns its low boundary plane and not its high one. The two
      # viewers derive all their geometry from `coordinates`, so a
      # centring-blind reversion shows up here and in no test.
      - name: Render both cases cell-centred, as the comparison
        run: |
          julia --project=bin bin/visualize.jl --centering=cell --no-display
          julia --project=bin bin/visualize2d.jl --centering=cell --no-display
      - name: Check that every figure was written
        run: |
          test -s bin/output/sine_1d.png
          test -s bin/output/pulse_1d.png
          test -s bin/output/pulse_1d_f32.png
          test -s bin/output/blast_2d.png
          test -s bin/output/blast_2d_frozen.png
          test -s bin/output/sine_1d_cell.png
          test -s bin/output/pulse_1d_cell.png
          test -s bin/output/blast_2d_cell.png
      - uses: actions/upload-artifact@v7
        with:
          name: figures
          path: bin/output/*.png
